# Netlify previously served this repo as raw HTML with no build step.
# Astro needs a build, and Netlify's default Node is older than Astro 7
# requires (>=22.12.0) — pinned here so the build does not depend on dashboard
# settings anyone can forget to update.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
